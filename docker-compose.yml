# LifeXP — infraestrutura local
services:
  db:
    image: postgres:16-alpine
    container_name: lifexp-db
    environment:
      POSTGRES_USER: lifexp
      POSTGRES_PASSWORD: lifexp_password
      POSTGRES_DB: lifexp
    ports:
      - "5438:5432"
    volumes:
      - lifexp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifexp -d lifexp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lifexp]

  redis:
    image: redis:7-alpine
    container_name: lifexp-redis
    ports:
      - "6388:6379"
    volumes:
      - lifexp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lifexp]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lifexp-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lifexp:lifexp_password@db:5432/lifexp?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3333
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3333}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_SECRET: ${APP_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      REFRESH_TOKEN_ROTATION: ${REFRESH_TOKEN_ROTATION:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lifexp_session}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [lifexp]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lifexp-web
    environment:
      NODE_ENV: production
      PORT: 5173
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    networks: [lifexp]

volumes:
  lifexp_db_data:
  lifexp_redis_data:

networks:
  lifexp:
    driver: bridge
